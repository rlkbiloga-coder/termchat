# Agente de Performance — extremamente avancado
# 1a opiniao: Google PageSpeed Insights API (free, sem chave)
# Se a API falhar: Lighthouse local (open source) — fallback do repositorio
name: Agente de Performance
on:
  schedule:
    - cron: "0 10 * * 3"   # toda quarta, 07:00 Brasilia
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: PageSpeed Insights API (free, sem chave)
        id: psi
        continue-on-error: true
        run: |
          curl -s --max-time 120 \
            "https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=https%3A%2F%2Frlkbiloga-coder.github.io%2Ftermchat%2F&category=performance&category=best-practices" \
            -o /tmp/psi.json
          node - <<'EOF'
          const fs = require('fs');
          fs.writeFileSync('/tmp/font.txt', 'up');
          let d;
          try { d = JSON.parse(fs.readFileSync('/tmp/psi.json', 'utf8')); } catch (e) { fs.writeFileSync('/tmp/font.txt', 'down'); process.exit(0); }
          if (!d.categories || !d.categories.performance) { fs.writeFileSync('/tmp/font.txt', 'down'); process.exit(0); }
          const p = Math.round(d.categories.performance.score * 100);
          const b = Math.round((d.categories['best-practices'] || {score: 1}).score * 100);
          const marca = n => n >= 90 ? '✅' : (n >= 50 ? '⚠️' : '❌');
          const m = d.audits || {};
          const corpo =
            '## Relatorio Performance (Google PageSpeed Insights API)\n\n' +
            '* Fonte: dados reais do laboratorio do Chromium, via API free sem chave\n' +
            '* Performance: **' + p + '/100** ' + marca(p) + '\n' +
            '* Boas praticas: **' + b + '/100** ' + marca(b) + '\n\n' +
            'Metricas principais:\n' +
            '* First Contentful Paint: ' + ((m['first-contentful-paint'] || {}).displayValue || '-') + '\n' +
            '* Largest Contentful Paint: ' + ((m['largest-contentful-paint'] || {}).displayValue || '-') + '\n' +
            '* Total Blocking Time: ' + ((m['total-blocking-time'] || {}).displayValue || '-') + '\n' +
            '* Cumulative Layout Shift: ' + ((m['cumulative-layout-shift'] || {}).displayValue || '-') + '\n';
          fs.writeFileSync('/tmp/resumo.md', corpo);
          console.log(corpo);
          process.exit(p < 50 || b < 50 ? 1 : 0);
          EOF
          codigo=$?
          echo "psifont=$(cat /tmp/font.txt)" >> "$GITHUB_OUTPUT"
          exit $codigo

      - name: Fallback — Lighthouse local (so se a API falhou)
        id: lh
        if: steps.psi.outputs.psifont == 'down'
        continue-on-error: true
        run: |
          echo "PageSpeed API indisponivel — usando Lighthouse local (fallback do repositorio)."
          npm install -g lighthouse
          lighthouse "https://rlkbiloga-coder.github.io/termchat/" \
            --output=json --output-path=/tmp/lh.json \
            --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance,best-practices --quiet
          node - <<'EOF'
          const lh = require('/tmp/lh.json');
          const cat = lh.categories;
          const p = Math.round((cat.performance.score || 0) * 100);
          const b = Math.round((cat['best-practices'].score || 0) * 100);
          const marca = n => n >= 90 ? '✅' : (n >= 50 ? '⚠️' : '❌');
          const corpo =
            '## Relatorio Performance (Lighthouse local — fallback)\n\n' +
            '* Performance: **' + p + '/100** ' + marca(p) + '\n' +
            '* Boas praticas: **' + b + '/100** ' + marca(b) + '\n\n' +
            'Metricas principais:\n' +
            '* First Contentful Paint: ' + Math.round(lh.audits['first-contentful-paint'].numericValue) + 'ms\n' +
            '* Total Blocking Time: ' + Math.round(lh.audits['total-blocking-time'].numericValue) + 'ms\n';
          require('fs').writeFileSync('/tmp/resumo.md', corpo);
          console.log(corpo);
          process.exit(p < 50 || b < 50 ? 1 : 0);
          EOF

      - name: Nota baixa ou falha total → issue para o Imperador
        if: steps.psi.outcome == 'failure' || steps.lh.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            let corpo = 'Nem a PageSpeed API nem o Lighthouse local conseguiram medir. Vale revisar manualmente.';
            try { corpo = require('fs').readFileSync('/tmp/resumo.md', 'utf8'); } catch (e) {}
            const titulo = '⚠️ Performance do site abaixo do esperado';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'performance', state: 'open'
            });
            const ja = issues.data.find(i => i.title === titulo);
            if (ja) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: ja.number, body: corpo
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titulo, body: corpo, labels: ['performance']
              });
            }
