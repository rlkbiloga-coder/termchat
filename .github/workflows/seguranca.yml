name: Agente de Seguranca
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
