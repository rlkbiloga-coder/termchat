# Agente de Entrega — o "serve base" do TermChat
#
# Este agente recebe cada push na main, valida tudo (sintaxe JS, JSONs,
# PWA) e publica o site no GitHub Pages:
#   https://nicolaswjwkwk.github.io/termchat/
#
# Usa apenas o token do workflow (secrets.GITHUB_TOKEN) e as Actions
# oficiais open source do GitHub. Nao usa token do Superagente Base44.
# O app e 100% site estatico (o server.js e opcional: bridge de APIs de IA).

name: Agente de Entrega
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez: push novo cancela o deploy antigo
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validar:
    name: Validar antes de servir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sintaxe de todos os JS do projeto
        run: |
          fail=0
          for f in $(find . -name "*.js" -not -path "./node_modules/*"); do
            node --check "$f" 2>/dev/null || \
              { cp "$f" /tmp/chk.mjs; node --check /tmp/chk.mjs 2>/dev/null || \
                { echo "ERRO sintaxe: $f"; fail=1; }; }
          done
          exit $fail

      - name: JSONs publicos validos
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('plugins.json','utf8'))"
          echo "JSONs validos"

      - name: PWA — manifest minimo
        run: |
          node -e "
            const m = require('./manifest.json');
            if (!m.name || !m.icons || !m.icons.length) { console.error('manifest incompleto'); process.exit(1); }
            if (!m.start_url) { console.error('manifest sem start_url'); process.exit(1); }
            console.log('PWA ok:', m.name, '-', m.icons.length, 'icones');
          "

  servir:
    name: Servir no Pages (serve base)
    needs: validar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Configurar Pages
        id: paginas
        uses: actions/configure-pages@v5
      - name: Empacotar site estatico
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: publicar
        uses: actions/deploy-pages@v4
