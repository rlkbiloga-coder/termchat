name: Agente de Qualidade
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Links do sitemap no ar
        run: |
          python3 - <<'PYEOF'
          import urllib.request, re, sys
          base = "https://rlkbiloga-coder.github.io/termchat"
          try:
              xml = urllib.request.urlopen(base + "/sitemap.xml", timeout=30).read().decode()
          except Exception as e:
              print("sitemap.xml inacessivel:", e); sys.exit(1)
          urls = re.findall(r"<loc>(.*?)</loc>", xml)
          if not urls:
              print("sitemap vazio"); sys.exit(1)
          fail = False
          for u in urls:
              try:
                  req = urllib.request.Request(u, method="HEAD", headers={"User-Agent": "agente-qualidade"})
                  r = urllib.request.urlopen(req, timeout=30)
                  print("OK", r.status, u)
              except Exception as e:
                  print("FALHOU", u, e); fail = True
          sys.exit(1 if fail else 0)
          PYEOF
      - name: SEO basico do index
        run: |
          html=$(curl -sL https://rlkbiloga-coder.github.io/termchat)
          echo "$html" | grep -q "<title>" || { echo "FALTA <title>"; exit 1; }
          echo "$html" | grep -q 'name="description"' || { echo "FALTA meta description"; exit 1; }
          echo "$html" | grep -q 'name="viewport"' || { echo "FALTA viewport"; exit 1; }
          echo "SEO basico OK"
      - name: Registrar problema (1 issue unico, sem duplicar)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const titulo = 'Qualidade: problema detectado';
            const logUrl = context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId;
            const agora = new Date().toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
            const issues = await github.rest.issues.listForRepo({
              owner, repo, labels: 'qualidade', state: 'open'
            });
            const jaAberto = issues.data.find(i => i.title === titulo);
            if (jaAberto) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: jaAberto.number,
                body: 'Problema detectado novamente em ' + agora + '. Log: ' + logUrl
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title: titulo,
                body: 'Verificacao automatica falhou em ' + agora + '.\nLog: ' + logUrl,
                labels: ['qualidade', 'automatico']
              });
            }
      - name: Tudo saudavel → fechar issue aberto
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const titulo = 'Qualidade: problema detectado';
            const issues = await github.rest.issues.listForRepo({
              owner, repo, labels: 'qualidade', state: 'open'
            });
            const aberto = issues.data.find(i => i.title === titulo);
            if (aberto) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: aberto.number,
                body: '✅ Verificacao passou em ' +
                  new Date().toISOString().slice(0, 16).replace('T', ' ') +
                  ' UTC. Fechando o alerta.'
              });
              await github.rest.issues.update({
                owner, repo, issue_number: aberto.number, state: 'closed'
              });
            } else {
              console.log('Tudo saudavel, nenhum alerta aberto.');
            }
