name: Agente de Qualidade
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Links do sitemap no ar
        run: |
          python3 - <<'PYEOF'
          import urllib.request, re, sys
          base = "https://nicolaswjwkwk.github.io/termchat"
          try:
              xml = urllib.request.urlopen(base + "/sitemap.xml", timeout=30).read().decode()
          except Exception as e:
              print("sitemap.xml inacessivel:", e); sys.exit(1)
          urls = re.findall(r"<loc>(.*?)</loc>", xml)
          if not urls:
              print("sitemap vazio"); sys.exit(1)
          fail = False
          for u in urls:
              try:
                  req = urllib.request.Request(u, method="HEAD", headers={"User-Agent": "agente-qualidade"})
                  r = urllib.request.urlopen(req, timeout=30)
                  print("OK", r.status, u)
              except Exception as e:
                  print("FALHOU", u, e); fail = True
          sys.exit(1 if fail else 0)
          PYEOF
      - name: SEO basico do index
        run: |
          html=$(curl -s https://nicolaswjwkwk.github.io/termchat)
          echo "$html" | grep -q "<title>" || { echo "FALTA <title>"; exit 1; }
          echo "$html" | grep -q 'name="description"' || { echo "FALTA meta description"; exit 1; }
          echo "$html" | grep -q 'name="viewport"' || { echo "FALTA viewport"; exit 1; }
          echo "SEO basico OK"
      - name: Abrir issue se falhou
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Qualidade: problema detectado',
              body: 'Verificacao automatica falhou. Log: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              labels: ['qualidade', 'automatico']
            });
