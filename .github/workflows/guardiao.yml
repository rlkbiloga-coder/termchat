name: Guardiao do Site
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sintaxe JS dos arquivos
        run: |
          fail=0
          for f in $(find . -name "*.js" -not -path "./node_modules/*" -not -path "./vendor/*"); do
            node --check "$f" 2>/dev/null || \
              { cp "$f" /tmp/chk.mjs; node --check /tmp/chk.mjs 2>/dev/null || \
                { echo "ERRO sintaxe: $f"; fail=1; }; }
          done
          exit $fail
      - name: Sintaxe JS dentro dos HTMLs
        run: |
          python3 - <<'PYEOF'
          import re, glob, subprocess, sys
          fail = False
          for f in glob.glob('*.html'):
              s = open(f, encoding='utf-8').read()
              for i, m in enumerate(re.finditer(r'<script>(.*?)</script>', s, re.S)):
                  open('/tmp/t.js', 'w').write(m.group(1))
                  r = subprocess.run(['node', '--check', '/tmp/t.js'], capture_output=True)
                  if r.returncode:
                      open('/tmp/t.mjs', 'w').write(m.group(1))
                      r2 = subprocess.run(['node', '--check', '/tmp/t.mjs'], capture_output=True)
                      if r2.returncode:
                          print(f, 'script', i, r2.stderr.decode()[:300])
                          fail = True
          sys.exit(1 if fail else 0)
          PYEOF
      - name: Site no ar (com retentativas — evita alarme falso durante deploy)
        run: |
          base="https://rlkbiloga-coder.github.io/termchat"
          ok=0
          for tentativa in 1 2 3; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 30 "$base" || echo 000)
            echo "Tentativa $tentativa: HTTP $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 20
          done
          [ "$ok" = "1" ] || { echo "::error::site fora do ar apos 3 tentativas"; exit 1; }
      - name: Arquivos essenciais (com retentativas)
        run: |
          base="https://rlkbiloga-coder.github.io/termchat"
          for f in index.html 404.html manifest.json robots.txt sitemap.xml; do
            ok=0
            for tentativa in 1 2 3; do
              code=$(curl -sfL -o /dev/null -w "%{http_code}" --max-time 30 "$base/$f" || echo 000)
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 20
            done
            [ "$ok" = "1" ] || { echo "FALTA apos 3 tentativas: $f"; exit 1; }
          done
      - name: Registrar problema (1 issue unico, sem duplicar)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const titulo = 'Guardiao: problema detectado no site';
            const logUrl = context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId;
            const agora = new Date().toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
            const issues = await github.rest.issues.listForRepo({
              owner, repo, labels: 'guardiao', state: 'open'
            });
            const jaAberto = issues.data.find(i => i.title === titulo);
            const corpo = 'Verificacao automatica falhou.\n\n' +
              '* Ultima deteccao: ' + agora + '\n' +
              '* Log: ' + logUrl + '\n\n' +
              'Este issue e unico e fica aberto enquanto o problema existir. ' +
              'Ele e atualizado a cada nova deteccao, sem abrir duplicados.';
            if (jaAberto) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: jaAberto.number,
                body: 'Problema detectado novamente em ' + agora + '. Log: ' + logUrl
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title: titulo, body: corpo,
                labels: ['guardiao', 'automatico']
              });
            }
      - name: Site saudavel → fechar issue aberto
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const titulo = 'Guardiao: problema detectado no site';
            const issues = await github.rest.issues.listForRepo({
              owner, repo, labels: 'guardiao', state: 'open'
            });
            const aberto = issues.data.find(i => i.title === titulo);
            if (aberto) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: aberto.number,
                body: '✅ Verificacao passou em ' +
                  new Date().toISOString().slice(0, 16).replace('T', ' ') +
                  ' UTC. Fechando o alerta.'
              });
              await github.rest.issues.update({
                owner, repo, issue_number: aberto.number, state: 'closed'
              });
            } else {
              console.log('Site saudavel, nenhum alerta aberto.');
            }
