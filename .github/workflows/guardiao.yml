name: Guardiao do Site
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Sintaxe JS dos arquivos
        run: |
          fail=0
          for f in $(find . -name "*.js" -not -path "./node_modules/*"); do
            node --check "$f" 2>/dev/null || \
              { cp "$f" /tmp/chk.mjs; node --check /tmp/chk.mjs 2>/dev/null || \
                { echo "ERRO sintaxe: $f"; fail=1; }; }
          done
          exit $fail
      - name: Sintaxe JS dentro dos HTMLs
        run: |
          python3 - <<'PYEOF'
          import re, glob, subprocess, sys
          fail = False
          for f in glob.glob('*.html'):
              s = open(f, encoding='utf-8').read()
              for i, m in enumerate(re.finditer(r'<script>(.*?)</script>', s, re.S)):
                  open('/tmp/t.js', 'w').write(m.group(1))
                  r = subprocess.run(['node', '--check', '/tmp/t.js'], capture_output=True)
                  if r.returncode:
                      open('/tmp/t.mjs', 'w').write(m.group(1))
                      r2 = subprocess.run(['node', '--check', '/tmp/t.mjs'], capture_output=True)
                      if r2.returncode:
                          print(f, 'script', i, r2.stderr.decode()[:300])
                          fail = True
          sys.exit(1 if fail else 0)
          PYEOF
      - name: Site no ar
        run: |
          code=$(curl -sL -o /dev/null -w "%{http_code}" https://nicolaswjwkwk.github.io/termchat)
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "::error::site fora do ar"; exit 1; }
      - name: Arquivos essenciais
        run: |
          for f in index.html 404.html manifest.json robots.txt sitemap.xml; do
            curl -sfL -o /dev/null "https://nicolaswjwkwk.github.io/termchat/$f" || { echo "FALTA: $f"; exit 1; }
          done
      - name: Abrir issue se falhou
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Guardiao: problema detectado no site',
              body: 'Verificacao automatica falhou. Log: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              labels: ['guardiao', 'automatico']
            });
