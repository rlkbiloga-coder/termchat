<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://text.pollinations.ai https://opencode.ai https://api.groq.com https://openrouter.ai; connect-src 'self' https: http://127.0.0.1:11434; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'none'">
<meta name="description" content="TermChat — chatbot leve estilo terminal com plugins gratuitos. 100% open source.">
<meta property="og:title" content="TermChat — chatbot terminal com plugins">
<meta property="og:description" content="TermChat — chatbot leve estilo terminal com plugins gratuitos. 100% open source.">
<meta name="robots" content="index,follow">
<title>TermChat — chatbot terminal com plugins</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192x192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0b0f14">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><span class="logo">TermChat</span><span id="status"><span class="dot"></span>boot ok</span></header>
<nav>
  <button data-v="chat" class="on">chat</button>
  <button data-v="explorar">explorar</button>
  <button data-v="config">config</button>
</nav>

<main id="chatView"></main>

<div id="exploreView" class="hidden">
  <div class="explore-top">
    <input id="pluginSearch" placeholder="buscar plugin…" oninput="renderExplore()">
  </div>
  <div class="chip-row" id="catChips"></div>
  <div class="explore-count" id="exploreCount"></div>
  <div class="grid" id="pluginGrid"></div>
</div>

<div id="configView" class="hidden">
  <div class="set">
    <h3>IA — provedor</h3>
    <label>Provedor (auto = cadeia grátis sem chave)</label>
    <select id="cfgProvider">
      <option value="auto">auto (grátis, sem chave)</option>
      <option value="pollinations">Pollinations (free, sem chave)</option>
      <option value="zen">OpenCode Zen (chave opencode.ai)</option>
      <option value="groq">Groq (free tier, chave)</option>
      <option value="openrouter">OpenRouter (chave)</option>
      <option value="ollama">Ollama (local, porta 11434)</option>
    </select>
    <label>Chave de API (opcional — fica só no seu navegador, nunca sai do dispositivo)</label>
    <input id="cfgKey" type="password" placeholder="não é obrigatório em modo auto/free" autocomplete="off">
    <label>Modelo (vazio = padrão do provedor)</label>
    <input id="cfgModel" placeholder="ex.: llama-3.3-70b-versatile">
    <div class="row" style="margin-top:10px"><button class="btn" onclick="saveCfg()">salvar</button><button class="btn" onclick="testAI()">testar conexão</button></div>
    <div id="cfgMsg" style="font-size:11px;color:var(--dim);margin-top:6px"></div>
  </div>
  <div class="set">
    <h3>Permissões do dispositivo</h3>
    <div id="permList"></div>
    <p style="font-size:11px;color:var(--dim);margin-top:8px">O site só pede permissão quando você instala o plugin que precisa dela.</p>
  </div>
  <div class="set">
    <h3>Dados</h3>
    <div class="row">
      <button class="btn" onclick="exportCfg()">exportar config (JSON)</button>
      <button class="btn" onclick="document.getElementById('impFile').click()">importar config</button>
      <button class="btn red" onclick="wipe()">apagar tudo</button>
      <input type="file" id="impFile" accept="application/json" class="hidden" onchange="importCfg(this)">
    </div>
  </div>
</div>

<form id="in" autocomplete="off">
  <input id="txt" placeholder="mensagem ou /comando… (/help)" maxlength="2000">
  <button id="send">enviar</button>
</form>
<footer>TermChat v1.0 · MIT · plugins via /explorar</footer>

<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
